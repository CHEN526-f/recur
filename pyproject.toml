[project]
name = "recur-instrument"
version = "0.1.0"
description = "A playable audiovisual sculpture, built with Python and real-time OpenGL."
requires-python = ">=3.11,<3.14"
dependencies = ["pygame>=2.6.1,<3", "moderngl>=5.12,<6", "numpy>=2.1,<3"]

[project.optional-dependencies]
camera = ["opencv-python>=4.10,<5"]

